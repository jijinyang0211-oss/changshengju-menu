<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>长生居 · 管理后台</title>
    <style>
        :root {
            --bg-deep: #120d07;
            --bg: #1c150d;
            --surface: rgba(38, 28, 17, .86);
            --surface-2: rgba(30, 22, 13, .9);
            --line: rgba(212, 169, 79, .30);
            --line-soft: rgba(212, 169, 79, .14);
            --gold: #d4a94f;
            --gold-l: #f2dca4;
            --gold-d: #9c7622;
            --text: #f1e6d0;
            --muted: #b8a588;
            --green: #7cbb8d;
            --green-l: #a8dcb8;
            --green-d: #4c8a5f;
            --amber: #e8b64a;
            --red: #e88f6a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Songti SC", "STSong", "SimSun", "PingFang SC", "Microsoft YaHei", serif;
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            background:
                radial-gradient(1100px 520px at 50% -8%, rgba(212, 169, 79, .12), transparent 62%),
                radial-gradient(820px 460px at 100% 108%, rgba(212, 169, 79, .07), transparent 60%),
                linear-gradient(180deg, #1b140c 0%, var(--bg-deep) 100%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 28px 16px 80px;
        }

        /* ===== 头部 ===== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            padding: 18px 24px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 14px 40px rgba(0, 0, 0, .5), inset 0 0 26px rgba(212, 169, 79, .04);
            animation: fadeDown .6s ease both;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 1.4em;
            font-weight: 700;
            letter-spacing: 5px;
            color: transparent;
            background: linear-gradient(160deg, var(--gold-l), var(--gold) 55%, var(--gold-d));
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 14px rgba(212, 169, 79, .3));
        }

        .back-link {
            color: var(--gold-l);
            text-decoration: none;
            padding: 8px 20px;
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: .9em;
            letter-spacing: 1px;
            background: rgba(212, 169, 79, .06);
            transition: all .25s;
        }

        .back-link:hover {
            background: rgba(212, 169, 79, .16);
            box-shadow: 0 0 16px rgba(212, 169, 79, .35);
        }

        /* ===== 统计卡 ===== */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--line-soft);
            border-radius: 12px;
            padding: 22px;
            text-align: center;
            transition: all .28s;
            animation: cardIn .5s ease both;
            overflow: hidden;
        }

        .stat-card:nth-child(1) { animation-delay: .05s; }
        .stat-card:nth-child(2) { animation-delay: .12s; }
        .stat-card:nth-child(3) { animation-delay: .19s; }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stat-card::before,
        .stat-card::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            border-color: var(--gold-d);
            border-style: solid;
            opacity: .55;
        }

        .stat-card::before {
            top: 6px;
            left: 6px;
            border-width: 1px 0 0 1px;
            border-radius: 3px 0 0 0;
        }

        .stat-card::after {
            bottom: 6px;
            right: 6px;
            border-width: 0 1px 1px 0;
            border-radius: 0 0 3px 0;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--line);
            box-shadow: 0 12px 30px rgba(0, 0, 0, .5), 0 0 24px rgba(212, 169, 79, .14);
        }

        .stat-number {
            font-size: 2.2em;
            font-weight: 900;
            color: transparent;
            background: linear-gradient(160deg, var(--gold-l), var(--gold) 55%, var(--gold-d));
            -webkit-background-clip: text;
            background-clip: text;
        }

        .stat-label {
            color: var(--muted);
            margin-top: 6px;
            font-size: .92em;
            letter-spacing: 2px;
        }

        /* ===== 刷新按钮 ===== */
        .refresh-btn {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, var(--gold-l), var(--gold) 50%, var(--gold-d));
            border: none;
            color: #241803;
            font-weight: 700;
            padding: 10px 28px;
            border-radius: 999px;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 2px;
            font-size: .95em;
            margin-bottom: 24px;
            transition: all .25s;
        }

        .refresh-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -80%;
            width: 50%;
            height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .55), transparent);
            transform: skewX(-20deg);
            animation: sheen 3.2s ease-in-out infinite;
        }

        @keyframes sheen {
            0%, 55% { left: -80%; }
            85%, 100% { left: 130%; }
        }

        .refresh-btn:hover {
            box-shadow: 0 0 24px rgba(212, 169, 79, .6);
            transform: translateY(-2px);
        }

        .refresh-btn:active {
            transform: scale(.96);
        }

        /* ===== 订单列表 ===== */
        .order-list {
            display: grid;
            gap: 16px;
        }

        .order-card {
            position: relative;
            background: linear-gradient(180deg, var(--surface) 0%, rgba(38, 28, 17, .94) 100%);
            border: 1px solid var(--line-soft);
            border-radius: 14px;
            padding: 22px;
            transition: all .28s;
            animation: cardIn .5s ease both;
            overflow: hidden;
        }

        .order-card::before,
        .order-card::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: var(--gold-d);
            border-style: solid;
            opacity: .55;
            transition: all .28s;
        }

        .order-card::before {
            top: 8px;
            left: 8px;
            border-width: 1px 0 0 1px;
            border-radius: 4px 0 0 0;
        }

        .order-card::after {
            bottom: 8px;
            right: 8px;
            border-width: 0 1px 1px 0;
            border-radius: 0 0 4px 0;
        }

        .order-card:hover {
            border-color: var(--line);
            box-shadow: 0 14px 34px rgba(0, 0, 0, .5), 0 0 26px rgba(212, 169, 79, .12);
        }

        .order-card:hover::before,
        .order-card:hover::after {
            opacity: 1;
            border-color: var(--gold);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .order-name {
            font-size: 1.25em;
            color: var(--gold-l);
            font-weight: 700;
            letter-spacing: 2px;
        }

        .order-time {
            font-size: .82em;
            color: var(--muted);
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .order-status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 16px;
            border-radius: 999px;
            font-size: .88em;
            border-width: 1px;
            border-style: solid;
            letter-spacing: 1px;
        }

        .order-status::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 8px currentColor;
        }

        .status-pending {
            background: rgba(212, 169, 79, .12);
            color: var(--gold-l);
            border-color: rgba(212, 169, 79, .5);
        }

        .status-confirmed {
            background: rgba(124, 187, 141, .12);
            color: var(--green-l);
            border-color: rgba(124, 187, 141, .5);
        }

        .status-completed {
            background: rgba(184, 165, 136, .12);
            color: #cdc1ac;
            border-color: rgba(184, 165, 136, .4);
        }

        .status-cancelled {
            background: rgba(232, 143, 106, .12);
            color: #e8a183;
            border-color: rgba(232, 143, 106, .5);
        }

        .order-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
            padding: 14px 16px;
            background: rgba(212, 169, 79, .05);
            border: 1px solid var(--line-soft);
            border-radius: 10px;
        }

        .order-detail-label {
            color: var(--muted);
            font-size: .8em;
            letter-spacing: 1px;
        }

        .order-detail-value {
            color: var(--text);
            margin-top: 3px;
            font-size: 1.05em;
            font-weight: 600;
        }

        .order-dishes {
            margin-bottom: 14px;
        }

        .order-dishes-label {
            color: var(--gold);
            font-size: .88em;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .order-dish-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .admin-dish-group {
            margin-bottom: 12px;
        }

        .admin-dish-group-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: .86em;
            color: var(--gold);
            letter-spacing: 2px;
            padding: 4px 0 6px;
            border-bottom: 1px dashed var(--line-soft);
            margin-bottom: 8px;
        }

        .admin-dish-group-title span {
            margin-left: auto;
            font-size: .8em;
            color: var(--muted);
        }

        .admin-dish-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
            gap: 10px;
        }

        .admin-dish-cell {
            background: rgba(20, 14, 8, .6);
            border: 1px solid var(--line-soft);
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            transition: all .2s;
        }

        .admin-dish-cell:hover {
            border-color: var(--gold);
            background: rgba(212, 169, 79, .08);
        }

        .admin-dish-cell img,
        .admin-dish-thumb {
            width: 100%;
            height: 64px;
            object-fit: cover;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #2a2013, #1c150d);
            border: 1px solid var(--line-soft);
            font-size: 1.4em;
            color: var(--gold);
        }

        .admin-dish-cell span {
            font-size: .82em;
            color: var(--gold-l);
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .order-dish-tag {
            border: 1px solid var(--line-soft);
            color: var(--gold-l);
            padding: 5px 14px;
            border-radius: 999px;
            font-size: .9em;
            background: rgba(212, 169, 79, .06);
        }

        .clickable {
            cursor: pointer;
            transition: all .22s;
        }

        .clickable:hover {
            border-color: var(--gold);
            color: #fff4d8;
            background: rgba(212, 169, 79, .16);
            box-shadow: 0 0 14px rgba(212, 169, 79, .3);
            transform: translateY(-1px);
        }

        .prep-dish-name.clickable {
            display: inline-block;
        }

        /* ===== 备菜清单 ===== */
        .order-prep {
            background: rgba(76, 138, 95, .1);
            border: 1px solid rgba(124, 187, 141, .3);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 16px;
        }

        .order-prep-label {
            color: var(--green-l);
            font-size: .92em;
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .prep-dish {
            margin-bottom: 10px;
        }

        .prep-dish:last-child {
            margin-bottom: 0;
        }

        .prep-dish-name {
            color: var(--green-l);
            font-size: .92em;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .prep-ingredients {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .prep-ingredient {
            background: rgba(124, 187, 141, .12);
            color: #a8dcb8;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: .8em;
            border: 1px solid rgba(124, 187, 141, .25);
        }

        /* ===== 忌口备注 ===== */
        .order-restrictions {
            background: rgba(212, 169, 79, .08);
            border-left: 3px solid var(--amber);
            padding: 12px 16px;
            margin-bottom: 16px;
            border-radius: 0 10px 10px 0;
            font-size: .92em;
            color: var(--gold-l);
        }

        /* ===== 操作按钮 ===== */
        .order-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 8px 20px;
            border-radius: 999px;
            border: 1px solid;
            cursor: pointer;
            font-family: inherit;
            font-size: .88em;
            letter-spacing: 1px;
            transition: all .22s;
        }

        .btn-confirm {
            background: linear-gradient(135deg, #a8dcb8, var(--green-d) 80%);
            border-color: transparent;
            color: #0d2410;
            font-weight: 700;
        }

        .btn-confirm:hover {
            box-shadow: 0 0 18px rgba(124, 187, 141, .55);
            transform: translateY(-1px);
        }

        .btn-complete {
            background: rgba(184, 165, 136, .12);
            color: #cdc1ac;
            border-color: rgba(184, 165, 136, .4);
        }

        .btn-complete:hover {
            background: rgba(184, 165, 136, .22);
        }

        .btn-cancel {
            background: rgba(232, 143, 106, .1);
            color: #e8a183;
            border-color: rgba(232, 143, 106, .45);
        }

        .btn-cancel:hover {
            background: rgba(232, 143, 106, .2);
        }

        .btn-delete {
            background: transparent;
            color: var(--muted);
            border-color: var(--line-soft);
        }

        .btn-delete:hover {
            border-color: var(--red);
            color: var(--red);
            background: rgba(232, 143, 106, .08);
        }

        /* ===== 采购汇总 ===== */
        .purchase-panel {
            background: linear-gradient(180deg, var(--surface) 0%, rgba(38, 28, 17, .94) 100%);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 20px 22px;
            margin-bottom: 24px;
            box-shadow: 0 14px 40px rgba(0, 0, 0, .45), inset 0 0 26px rgba(212, 169, 79, .04);
            animation: cardIn .5s ease both;
        }

        .purchase-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .purchase-head h2 {
            font-size: 1.25em;
            font-weight: 700;
            letter-spacing: 4px;
            color: transparent;
            background: linear-gradient(160deg, var(--gold-l), var(--gold) 55%, var(--gold-d));
            -webkit-background-clip: text;
            background-clip: text;
        }

        .purchase-badge {
            color: var(--gold-l);
            font-size: .82em;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 3px 14px;
            letter-spacing: 1px;
            background: rgba(212, 169, 79, .08);
        }

        .purchase-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .copy-btn {
            padding: 7px 20px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(212, 169, 79, .08);
            color: var(--gold-l);
            font-family: inherit;
            font-size: .85em;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all .22s;
        }

        .copy-btn:hover {
            background: rgba(212, 169, 79, .18);
            box-shadow: 0 0 14px rgba(212, 169, 79, .3);
        }

        .copy-btn.copied {
            border-color: var(--green);
            color: var(--green-l);
            background: rgba(124, 187, 141, .12);
        }

        .purchase-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .ptab {
            padding: 7px 22px;
            border-radius: 999px;
            border: 1px solid var(--line-soft);
            background: transparent;
            color: var(--muted);
            font-family: inherit;
            font-size: .9em;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all .22s;
        }

        .ptab:hover {
            color: var(--gold-l);
            border-color: var(--line);
        }

        .ptab.active {
            background: linear-gradient(135deg, var(--gold-l), var(--gold) 55%, var(--gold-d));
            border-color: transparent;
            color: #241803;
            font-weight: 700;
        }

        /* ---- 按订单汇总 ---- */
        .order-purchase-card {
            border: 1px solid var(--line-soft);
            border-radius: 12px;
            padding: 14px 16px;
            background: rgba(212, 169, 79, .03);
            margin-bottom: 12px;
            animation: cardIn .5s ease both;
        }

        .opc-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .opc-date {
            color: var(--gold-l);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .opc-meta {
            color: var(--muted);
            font-size: .8em;
            letter-spacing: 1px;
        }

        .opc-dishes {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--line-soft);
        }

        .opc-dish {
            font-size: .78em;
            color: var(--text);
            border: 1px solid var(--line-soft);
            border-radius: 999px;
            padding: 2px 10px;
            background: rgba(212, 169, 79, .06);
        }

        .opc-groups {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .opc-group {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .opc-group-title {
            width: 64px;
            flex-shrink: 0;
            font-size: .8em;
            color: var(--gold);
            letter-spacing: 1px;
            padding-top: 3px;
        }

        .opc-items {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            flex: 1;
        }

        .opc-item {
            font-size: .76em;
            color: var(--text);
            border: 1px solid var(--line-soft);
            border-radius: 999px;
            padding: 2px 9px;
            background: rgba(212, 169, 79, .05);
        }

        .purchase-stats {
            color: var(--muted);
            font-size: .85em;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .purchase-groups {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 14px;
        }

        .purchase-group {
            border: 1px solid var(--line-soft);
            border-radius: 10px;
            padding: 12px 14px;
            background: rgba(212, 169, 79, .03);
        }

        .purchase-group-title {
            font-size: .95em;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--line-soft);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .purchase-group-title .pc {
            font-size: .75em;
            font-weight: 400;
            color: var(--muted);
            border: 1px solid var(--line-soft);
            border-radius: 999px;
            padding: 0 9px;
            letter-spacing: 0;
        }

        .pg-0 .purchase-group-title { color: #8fd0e8; }
        .pg-1 .purchase-group-title { color: #e8b6a1; }
        .pg-2 .purchase-group-title { color: #e8c98a; }
        .pg-3 .purchase-group-title { color: #a8c9a0; }
        .pg-4 .purchase-group-title { color: #9fd6ae; }
        .pg-5 .purchase-group-title { color: #d6c98a; }
        .pg-6 .purchase-group-title { color: #cdc1ac; }
        .pg-7 .purchase-group-title { color: var(--muted); }

        .purchase-items {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .purchase-item {
            font-size: .84em;
            color: var(--text);
            border: 1px solid var(--line-soft);
            background: rgba(212, 169, 79, .06);
            border-radius: 999px;
            padding: 3px 12px;
            line-height: 1.5;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            background: var(--surface);
            border: 1px dashed var(--line-soft);
            border-radius: 14px;
        }

        .empty-icon {
            font-size: 3.4em;
            margin-bottom: 14px;
            opacity: .6;
            animation: floaty 3.6s ease-in-out infinite;
        }

        @keyframes floaty {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .empty-state p {
            letter-spacing: 2px;
        }

        /* ===== 菜品详情弹层 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(8, 5, 2, .78);
            backdrop-filter: blur(3px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 16px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-overlay.show .modal {
            animation: popIn .32s cubic-bezier(.22, 1.2, .36, 1) both;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(.92) translateY(18px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal {
            position: relative;
            background: linear-gradient(180deg, #2a2013 0%, #1c150d 100%);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 26px;
            width: 100%;
            max-width: 500px;
            max-height: 88vh;
            overflow-y: auto;
            box-shadow: 0 30px 70px rgba(0, 0, 0, .7), inset 0 0 40px rgba(212, 169, 79, .05);
        }

        .modal::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 1px solid rgba(212, 169, 79, .12);
            border-radius: 10px;
            pointer-events: none;
        }

        .modal > * {
            position: relative;
        }

        .detail-image {
            width: 100%;
            max-height: 280px;
            object-fit: contain;
            display: block;
            border-radius: 10px;
            padding: 8px;
            background: #f3ead6;
            border: 1px solid var(--line);
            margin-bottom: 16px;
        }

        .detail-name {
            font-size: 1.4em;
            color: var(--gold-l);
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .detail-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .detail-tag {
            font-size: .76em;
            color: var(--muted);
            border: 1px solid var(--line-soft);
            border-radius: 999px;
            padding: 1px 10px;
        }

        .detail-desc {
            color: var(--muted);
            font-size: .95em;
            margin-bottom: 16px;
            line-height: 1.8;
        }

        .detail-section {
            background: rgba(212, 169, 79, .05);
            border: 1px solid var(--line-soft);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 18px;
        }

        .detail-section h3 {
            color: var(--gold);
            font-size: .92em;
            margin-bottom: 8px;
            letter-spacing: 3px;
        }

        .detail-section ul {
            list-style: none;
        }

        .detail-section li {
            color: var(--text);
            font-size: .92em;
            padding: 3px 0;
        }

        .detail-section li::before {
            content: '· ';
            color: var(--gold);
        }

        .detail-steps {
            list-style: none;
            counter-reset: step;
        }

        .detail-steps li {
            display: flex;
            gap: 10px;
            padding: 5px 0;
            counter-increment: step;
        }

        .detail-steps li::before {
            content: counter(step);
            flex: none;
            width: 22px;
            height: 22px;
            line-height: 22px;
            text-align: center;
            border-radius: 50%;
            background: rgba(212, 169, 79, .12);
            border: 1px solid rgba(212, 169, 79, .4);
            color: var(--gold);
            font-size: .78em;
            margin-top: 2px;
        }

        .modal-close {
            display: block;
            margin: 0 auto;
            padding: 10px 34px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--gold-l), var(--gold) 50%, var(--gold-d));
            border: none;
            color: #241803;
            font-family: inherit;
            font-size: .95em;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all .25s;
        }

        .modal-close:hover {
            box-shadow: 0 0 20px rgba(212, 169, 79, .55);
            transform: translateY(-1px);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .container { padding: 16px; }
            header { flex-direction: column; gap: 12px; text-align: center; }
            .order-details { grid-template-columns: 1fr 1fr; }
        }

        @media (prefers-reduced-motion: reduce) {
            .refresh-btn::after, .empty-icon {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>长生居 · 管理后台</h1>
            <a href="/" class="back-link">返回菜单</a>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalOrders">0</div>
                <div class="stat-label">总预订数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pendingOrders">0</div>
                <div class="stat-label">待确认</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="todayOrders">0</div>
                <div class="stat-label">今日预订</div>
            </div>
        </div>

        <button class="refresh-btn" onclick="loadOrders()">刷新数据</button>

        <!-- 采购汇总 -->
        <div class="purchase-panel" id="purchasePanel">
            <div class="purchase-head">
                <h2>采购汇总</h2>
                <div class="purchase-actions">
                    <span class="purchase-badge" id="purchaseBadge">0 单待备菜</span>
                    <button class="copy-btn" id="copyPurchaseBtn">复制采购单</button>
                </div>
            </div>
            <div class="purchase-tabs">
                <button class="ptab active" data-mode="all">分类汇总</button>
                <button class="ptab" data-mode="per">按订单汇总</button>
            </div>
            <div class="purchase-stats" id="purchaseStats"></div>
            <div class="purchase-groups" id="purchaseGroups"></div>
        </div>

        <div class="order-list" id="orderList"></div>
    </div>

    <!-- 菜品详情弹层 -->
    <div class="modal-overlay" id="dishModal">
        <div class="modal">
            <img src="" alt="" class="detail-image" id="dImage">
            <div class="detail-name" id="dName"></div>
            <div class="detail-tags" id="dTags"></div>
            <div class="detail-desc" id="dDesc"></div>
            <div class="detail-section">
                <h3>制作原材料</h3>
                <ul id="dIngredients"></ul>
            </div>
            <div class="detail-section">
                <h3>常见做法</h3>
                <ol class="detail-steps" id="dSteps"></ol>
            </div>
            <button class="modal-close" id="dishModalClose">关闭</button>
        </div>
    </div>

    <script>
        const STATUS_MAP = {
            '待确认': { class: 'status-pending', label: '待确认' },
            '已确认': { class: 'status-confirmed', label: '已确认' },
            '已完成': { class: 'status-completed', label: '已完成' },
            '已取消': { class: 'status-cancelled', label: '已取消' }
        };

        let MENU = [];

        // HTML 转义，防止用户输入注入脚本（XSS）
        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // 管理密码：首次操作时输入并缓存，写接口需携带
        function getAdminToken() {
            let t = localStorage.getItem('admin_token');
            if (!t) {
                t = prompt('请输入管理密码');
                if (t) localStorage.setItem('admin_token', t);
            }
            return t || '';
        }

        // ===== 加载菜单（用于菜品详情） =====
        async function loadMenuData() {
            try {
                const res = await fetch('/api/menu');
                const data = await res.json();
                MENU = data.menu || [];
            } catch (err) {
                console.error('加载菜单失败:', err);
            }
        }

        // ===== 菜品详情弹层 =====
        function openDishDetail(id, name) {
            let dish = id != null ? MENU.find(m => m.id === id) : null;
            if (!dish) dish = MENU.find(m => m.name === name);
            if (!dish) return;

            const img = document.getElementById('dImage');
            if (dish.image) {
                img.src = dish.image;
                img.alt = dish.name;
                img.style.display = 'block';
            } else {
                img.removeAttribute('src');
                img.style.display = 'none';
            }
            document.getElementById('dName').textContent = dish.name;
            document.getElementById('dTags').innerHTML = (dish.tags || []).map(t => `<span class="detail-tag">${escapeHtml(t)}</span>`).join('');
            document.getElementById('dDesc').textContent = dish.description;
            const ingredients = dish.ingredients || [];
            document.getElementById('dIngredients').innerHTML = ingredients.length
                ? ingredients.map(i => `<li>${escapeHtml(i)}</li>`).join('')
                : '<li style="color: var(--muted);">暂无食材记录</li>';
            const steps = dish.steps || [];
            document.getElementById('dSteps').innerHTML = steps.length
                ? steps.map(s => `<li>${escapeHtml(s)}</li>`).join('')
                : '<li style="color: var(--muted);">做法以当日主厨出品为准</li>';

            document.getElementById('dishModal').classList.add('show');
        }

        document.getElementById('dishModalClose').addEventListener('click', () => {
            document.getElementById('dishModal').classList.remove('show');
        });

        document.getElementById('dishModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('dishModal')) {
                document.getElementById('dishModal').classList.remove('show');
            }
        });

        let lastOrders = [];

        async function loadOrders() {
            try {
                const res = await fetch('/api/orders');
                const data = await res.json();
                lastOrders = data.orders;
                renderOrders(data.orders);
                updateStats(data.orders);
                renderPurchaseSummary(data.orders);
            } catch (err) {
                console.error('加载订单失败:', err);
            }
        }

        // ===== 复制采购单 =====
        function formatAllText(active) {
            const { groups, dishCount } = collectByCat(active);
            const names = catNames();
            const total = groups.reduce((s, set) => s + set.size, 0);
            const lines = [`【长生居 · 采购单】${active.length} 单待备菜 · ${dishCount} 道菜 · ${total} 种食材`, ''];
            groups.forEach((set, i) => {
                if (!set.size) return;
                lines.push(`■ ${names[i]}（${set.size}）`);
                Array.from(set).sort((a, b) => a.localeCompare(b, 'zh')).forEach(it => lines.push(`  · ${it}`));
                lines.push('');
            });
            return lines.join('\n');
        }

        function formatPerOrderText(active) {
            const names = catNames();
            const sorted = active.slice().sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
            const lines = ['【长生居 · 采购单】按订单汇总', ''];
            sorted.forEach((order, idx) => {
                const { groups, dishCount } = collectByCat([order]);
                const orderId = String(order.id || '').slice(-6);
                const dishes = (order.dishes || []).map(d => typeof d === 'string' ? d : d.name);
                lines.push(`${idx + 1}. ${order.date} ${order.time} · ${order.name} · 单号#${orderId} · ${dishCount} 道菜`);
                lines.push(`   菜品：${dishes.join('、')}`);
                groups.forEach((set, i) => {
                    if (!set.size) return;
                    lines.push(`   ■ ${names[i]}（${set.size}）`);
                    Array.from(set).sort((a, b) => a.localeCompare(b, 'zh')).forEach(it => lines.push(`      · ${it}`));
                });
                lines.push('');
            });
            return lines.join('\n');
        }

        async function copyPurchaseText() {
            const active = lastOrders.filter(o => o.status === '待确认' || o.status === '已确认');
            if (active.length === 0) {
                alert('当前没有待备菜的订单');
                return;
            }
            const text = purchaseMode === 'all' ? formatAllText(active) : formatPerOrderText(active);

            try {
                await navigator.clipboard.writeText(text);
            } catch (err) {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
            }

            const btn = document.getElementById('copyPurchaseBtn');
            btn.textContent = '已复制';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.textContent = '复制采购单';
                btn.classList.remove('copied');
            }, 2000);
        }

        document.getElementById('copyPurchaseBtn').addEventListener('click', copyPurchaseText);

        // ===== 采购汇总 =====
        const PURCHASE_CATS = [
            { name: '水产海鲜', keys: ['虾', '鳝', '鱿鱼', '墨鱼', '目鱼', '蟹', '河鲜', '鱼', '贝'] },
            { name: '肉品类', keys: ['肉', '猪', '牛', '排骨', '肝', '蹄筋', '方腿', '火腿', '肠', '夹心', '通脊'] },
            { name: '禽蛋类', keys: ['鸡', '鸭', '鹅', '蛋'] },
            { name: '豆制品', keys: ['豆腐', '豆干', '腐竹', '干丝'] },
            { name: '葱姜蒜', keys: ['葱', '姜', '蒜'] },
            { name: '蔬菜菌菇', keys: ['黄瓜', '青椒', '豆芽', '木耳', '香菇', '蘑菇', '草菇', '菜心', '胡萝卜', '萝卜', '笋', '茭白', '香菜', '榨菜', '蒜苗', '韭黄', '金针'] },
            { name: '调味干货', keys: ['淀粉', '料酒', '糖', '醋', '盐', '酱油', '酱', '花椒', '胡椒', '香油', '五香', '番茄', '面包糠', '芝麻', '花生', '油'] }
        ];

        function classifyIngredient(item) {
            for (let i = 0; i < PURCHASE_CATS.length; i++) {
                if (PURCHASE_CATS[i].keys.some(k => item.includes(k))) return i;
            }
            return PURCHASE_CATS.length; // 其它
        }

        let purchaseMode = 'all';

        function collectByCat(orders) {
            const groups = PURCHASE_CATS.map(() => new Set());
            const otherSet = new Set();
            let dishCount = 0;
            orders.forEach(o => (o.dishes || []).forEach(d => {
                dishCount++;
                (d.ingredients || []).forEach(item => {
                    const cat = classifyIngredient(item);
                    if (cat < PURCHASE_CATS.length) groups[cat].add(item);
                    else otherSet.add(item);
                });
            }));
            return { groups: [...groups, otherSet], dishCount };
        }

        function catNames() {
            return [...PURCHASE_CATS.map(c => c.name), '其它'];
        }

        function renderPurchaseSummary(orders) {
            const active = orders.filter(o => o.status === '待确认' || o.status === '已确认');
            document.getElementById('purchaseBadge').textContent = `${active.length} 单待备菜`;
            if (purchaseMode === 'all') renderAllSummary(active);
            else renderPerOrderSummary(active);
        }

        // 分类汇总：全部待备菜订单合并去重
        function renderAllSummary(active) {
            const { groups, dishCount } = collectByCat(active);
            const totalItems = groups.reduce((s, set) => s + set.size, 0);
            document.getElementById('purchaseStats').textContent =
                `共 ${active.length} 单待备菜 · ${dishCount} 道菜 · 汇总 ${totalItems} 种食材（跨单去重）`;

            const names = catNames();
            const wrap = document.getElementById('purchaseGroups');
            wrap.innerHTML = groups.map((set, i) => {
                if (set.size === 0) return '';
                return `
                    <div class="purchase-group pg-${i}">
                        <div class="purchase-group-title">${escapeHtml(names[i])}<span class="pc">${set.size}</span></div>
                        <div class="purchase-items">
                            ${Array.from(set).sort((a, b) => a.localeCompare(b, 'zh')).map(it => `<span class="purchase-item">${escapeHtml(it)}</span>`).join('')}
                        </div>
                    </div>`;
            }).join('') || '<div class="purchase-group"><div class="purchase-group-title">暂无食材</div></div>';
        }

        // 按订单汇总：每个订单一张采购卡
        function renderPerOrderSummary(active) {
            const wrap = document.getElementById('purchaseGroups');
            const names = catNames();
            const sorted = active.slice().sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));

            document.getElementById('purchaseStats').textContent =
                `共 ${active.length} 单待备菜 · 每单单独汇总，便于按日期分别采购`;

            if (sorted.length === 0) {
                wrap.innerHTML = '<div class="purchase-group"><div class="purchase-group-title">暂无食材</div></div>';
                return;
            }

            wrap.innerHTML = sorted.map((order, idx) => {
                const { groups, dishCount } = collectByCat([order]);
                const totalItems = groups.reduce((s, set) => s + set.size, 0);
                const orderId = String(order.id || '').slice(-6);
                const dishes = (order.dishes || []).map(d => typeof d === 'string' ? d : d.name);

                const blocks = groups.map((set, i) => {
                    if (set.size === 0) return '';
                    return `
                        <div class="opc-group">
                            <div class="opc-group-title">${escapeHtml(names[i])}</div>
                            <div class="opc-items">
                                ${Array.from(set).sort((a, b) => a.localeCompare(b, 'zh')).map(it => `<span class="opc-item">${escapeHtml(it)}</span>`).join('')}
                            </div>
                        </div>`;
                }).join('');

                return `
                    <div class="order-purchase-card" style="animation-delay:${Math.min(idx * 60, 360)}ms">
                        <div class="opc-head">
                            <span class="opc-date">${escapeHtml(order.date)} ${escapeHtml(order.time)}</span>
                            <span class="opc-meta">单号 #${orderId} · ${escapeHtml(order.name)} · ${dishCount} 道菜 · ${totalItems} 种食材</span>
                        </div>
                        <div class="opc-dishes">${dishes.map(n => `<span class="opc-dish">${escapeHtml(n)}</span>`).join('')}</div>
                        <div class="opc-groups">
                            ${blocks || '<div class="opc-group"><div class="opc-group-title">无</div><div class="opc-items"><span class="opc-item">无备料记录</span></div></div>'}
                        </div>
                    </div>`;
            }).join('');
        }

        document.querySelectorAll('.ptab').forEach(btn => {
            btn.addEventListener('click', () => {
                purchaseMode = btn.dataset.mode;
                document.querySelectorAll('.ptab').forEach(b => b.classList.toggle('active', b === btn));
                loadOrders();
            });
        });

        function updateStats(orders) {
            const now = new Date();
            const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            document.getElementById('totalOrders').textContent = orders.length;
            document.getElementById('pendingOrders').textContent = orders.filter(o => o.status === '待确认').length;
            document.getElementById('todayOrders').textContent = orders.filter(o => o.date === today).length;
        }

        // ===== 菜品分组展示（按分类排版 + 图片） =====
        function adminDishGroupHTML(dishList) {
            const groups = {};
            const catOrder = [];
            dishList.forEach(d => {
                const dish = (d.id != null ? MENU.find(m => m.id === d.id) : null)
                    || MENU.find(m => m.name === d.name)
                    || { id: d.id, name: d.name, image: '', category: '其他', subCategory: '' };
                if (!groups[dish.category]) { groups[dish.category] = []; catOrder.push(dish.category); }
                groups[dish.category].push(dish);
            });
            return catOrder.map(cat => `
                <div class="admin-dish-group">
                    <div class="admin-dish-group-title">${escapeHtml(cat)}<span>${groups[cat].length} 道</span></div>
                    <div class="admin-dish-grid">
                        ${groups[cat].map(dish => {
                            const img = dish.image
                                ? `<img src="${escapeHtml(dish.image)}" alt="">`
                                : `<div class="admin-dish-thumb">${escapeHtml(dish.name.slice(0, 1))}</div>`;
                            return `
                                <div class="admin-dish-cell clickable" data-dish-id="${dish.id || ''}" data-dish-name="${escapeHtml(dish.name)}" title="查看菜品详情">
                                    ${img}
                                    <span>${escapeHtml(dish.name)}</span>
                                </div>`;
                        }).join('')}
                    </div>
                </div>`).join('');
        }

        function renderOrders(orders) {
            const list = document.getElementById('orderList');

            if (orders.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📋</div>
                        <p>暂无预订订单</p>
                        <p style="margin-top: 8px; font-size: .9em;">分享菜单给朋友，等他们来点菜吧</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = orders.map((order, idx) => {
                const statusInfo = STATUS_MAP[order.status] || STATUS_MAP['待确认'];
                // 兼容旧订单（dishes 为字符串数组）和新订单（dishes 为对象数组）
                const dishList = (order.dishes || []).map(d => typeof d === 'string' ? { name: d, ingredients: [] } : d);
                const orderId = String(order.id || '').slice(-6);
                return `
                    <div class="order-card" style="animation-delay:${Math.min(idx * 60, 360)}ms">
                        <div class="order-header">
                            <div>
                                <div class="order-name">${escapeHtml(order.name)}</div>
                                <div class="order-time">单号 #${orderId} · 下单 ${escapeHtml(order.createdAt)}</div>
                            </div>
                            <span class="order-status ${statusInfo.class}">${escapeHtml(statusInfo.label)}</span>
                        </div>
                        <div class="order-details">
                            <div class="order-detail-item">
                                <div class="order-detail-label">用餐日期</div>
                                <div class="order-detail-value">${escapeHtml(order.date)}</div>
                            </div>
                            <div class="order-detail-item">
                                <div class="order-detail-label">用餐时间</div>
                                <div class="order-detail-value">${escapeHtml(order.time)}</div>
                            </div>
                            <div class="order-detail-item">
                                <div class="order-detail-label">用餐人数</div>
                                <div class="order-detail-value">${escapeHtml(order.guests)} 人</div>
                            </div>
                        </div>
                        <div class="order-dishes">
                            <div class="order-dishes-label">已点菜品（点击可查看详情）</div>
                            ${adminDishGroupHTML(dishList)}
                        </div>
                        <div class="order-prep">
                            <div class="order-prep-label">备菜清单（按菜品）</div>
                            ${dishList.map(d => `
                                <div class="prep-dish">
                                    <div class="prep-dish-name clickable" data-dish-id="${d.id || ''}" data-dish-name="${escapeHtml(d.name)}">▪ ${escapeHtml(d.name)}</div>
                                    <div class="prep-ingredients">
                                        ${(d.ingredients || []).length ? d.ingredients.map(i => `<span class="prep-ingredient">${escapeHtml(i)}</span>`).join('') : '<span class="prep-ingredient">无备料记录</span>'}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        ${order.restrictions ? `
                            <div class="order-restrictions">
                                <strong>忌口/备注：</strong>${escapeHtml(order.restrictions)}
                            </div>
                        ` : ''}
                        ${order.wishDishes ? `
                            <div class="order-restrictions wish">
                                <strong>想吃的菜：</strong>${escapeHtml(order.wishDishes)}
                            </div>
                        ` : ''}
                        <div class="order-actions">
                            ${order.status === '待确认' ? `
                                <button class="action-btn btn-confirm" onclick="updateStatus(${order.id}, '已确认')">确认预订</button>
                                <button class="action-btn btn-cancel" onclick="updateStatus(${order.id}, '已取消')">取消</button>
                            ` : ''}
                            ${order.status === '已确认' ? `
                                <button class="action-btn btn-complete" onclick="updateStatus(${order.id}, '已完成')">已完成</button>
                            ` : ''}
                            <button class="action-btn btn-delete" onclick="deleteOrder(${order.id})">删除</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function updateStatus(orderId, status) {
            try {
                const res = await fetch(`/api/order/${orderId}/status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Admin-Token': getAdminToken() },
                    body: JSON.stringify({ status })
                });
                if (res.status === 401) {
                    localStorage.removeItem('admin_token');
                    alert('密码错误，请重试');
                    return;
                }
                loadOrders();
            } catch (err) {
                console.error('更新状态失败:', err);
                alert('操作失败');
            }
        }

        async function deleteOrder(orderId) {
            if (!confirm('确定要删除这个订单吗？')) return;
            try {
                const res = await fetch(`/api/order/${orderId}`, {
                    method: 'DELETE',
                    headers: { 'X-Admin-Token': getAdminToken() }
                });
                if (res.status === 401) {
                    localStorage.removeItem('admin_token');
                    alert('密码错误，请重试');
                    return;
                }
                loadOrders();
            } catch (err) {
                console.error('删除订单失败:', err);
                alert('删除失败');
            }
        }

        // 菜品详情点击事件委托（替代内联 onclick，避免属性注入）
        document.getElementById('orderList').addEventListener('click', (e) => {
            const cell = e.target.closest('.admin-dish-cell, .prep-dish-name');
            if (!cell) return;
            const id = cell.dataset.dishId ? parseInt(cell.dataset.dishId) : null;
            openDishDetail(id, cell.dataset.dishName);
        });

        loadMenuData().then(loadOrders);
        setInterval(loadOrders, 15000);
    </script>
</body>
</html>
